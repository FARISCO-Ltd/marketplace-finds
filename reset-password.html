<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Marketplace Finds | Set new password</title>
  <link rel="stylesheet" href="admin.css?v=12">
</head>
<body>
  <main class="admin-shell">
    <section class="login-panel">
      <a class="admin-brand" href="index.html"><img src="assets/images/icon.png" alt=""><span>Marketplace <strong>Finds</strong></span></a>
      <div class="login-card">
        <p class="eyebrow">Private area</p>
        <h1>Set a new password</h1>
        <p class="muted">Choose a new password for your product manager.</p>
        <form id="reset-form">
          <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
          <button type="submit">Save new password</button>
          <p class="form-message" id="reset-message" role="alert"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="config.js?v=12"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js?v=12"></script>
</body>
</html>
